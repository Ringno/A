<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101218">
<title>A20 · 윤서아 이미지 갤러리</title>
<meta name="description" content="Ringno/A A20 윤서아 이미지 전체 미리보기 갤러리">
<style>
:root{color-scheme:dark;--bg:#0c0f14;--panel:#141922;--panel2:#1a202b;--line:#293241;--text:#f2f5fa;--muted:#9da8b8;--accent:#b8d3ff;--accent2:#d5e4ff;--radius:17px}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% -10%,#26364d 0,transparent 36%),linear-gradient(180deg,#10151e 0,#0c0f14 420px)}
button,input{font:inherit}
.wrap{width:min(1540px,100%);margin:auto;padding:30px 24px 72px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--accent);text-transform:uppercase;margin-bottom:9px}
h1{font-size:clamp(29px,4vw,46px);line-height:1.05;letter-spacing:-.055em;margin:0}
.subtitle{margin-top:10px;color:var(--muted);font-size:14px}
.hero-mark{display:flex;align-items:center;gap:10px;border:1px solid #35445a;background:#151e2b;padding:12px 15px;border-radius:14px;color:#dce9ff;font-size:12px}
.dot{width:8px;height:8px;border-radius:99px;background:#7fbcff;box-shadow:0 0 14px #7fbcff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:24px 0}
.stat{background:linear-gradient(145deg,#171e29,#121720);border:1px solid var(--line);border-radius:15px;padding:15px 16px}
.stat-label{font-size:12px;color:var(--muted)}
.stat-value{font-size:27px;font-weight:800;letter-spacing:-.04em;margin-top:5px;font-variant-numeric:tabular-nums}
.stat-value small{font-size:12px;color:var(--muted);font-weight:600;margin-left:4px;letter-spacing:0}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(12,15,20,.91);backdrop-filter:blur(16px);padding:12px 0 13px;margin-bottom:14px;border-bottom:1px solid rgba(65,78,98,.45)}
.controls{display:flex;gap:10px}
.search{flex:1;min-width:0;background:#151b25;border:1px solid #303b4c;color:var(--text);padding:13px 15px;border-radius:12px;outline:none}
.search:focus{border-color:#89b9f8;box-shadow:0 0 0 3px rgba(137,185,248,.12)}
.refresh{border:1px solid #35445a;background:#1a2534;color:#e2edff;padding:0 17px;border-radius:12px;cursor:pointer;white-space:nowrap}
.refresh:hover,.tab:hover{border-color:#6d8eb9}
.tabs{display:flex;gap:8px;margin-top:11px;overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:#151b25;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px}
.tab.active{background:var(--accent2);border-color:var(--accent2);color:#101722;font-weight:800}
.status{font-size:12px;color:var(--muted);padding:5px 1px 0;min-height:22px}
.folder-section{margin:28px 0 40px}
.folder-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(110deg,#192333,#141a24)}
.folder-title{display:flex;align-items:center;gap:11px}
.folder-icon{width:35px;height:35px;border-radius:11px;background:#26364a;color:#cfe2ff;display:grid;place-items:center;font-weight:900}
.folder-head h2{margin:0;font-size:20px;letter-spacing:-.03em}
.folder-desc{color:var(--muted);font-size:12px;margin-top:4px}
.folder-count{font-size:13px;color:#dce9ff;font-variant-numeric:tabular-nums}
.category{margin:22px 0 28px}
.category-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:11px}
.category-head h3{font-size:15px;margin:0;font-weight:800}
.category-head span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.tile{display:block;width:100%;padding:0;text-align:left;color:var(--text);background:var(--panel);border:1px solid #273140;border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,background .18s}
.tile:hover{transform:translateY(-3px);border-color:#7899c2;background:#1a2330}
.thumb{aspect-ratio:3/4;background:#080b10;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.tile:hover .thumb img{transform:scale(1.035)}
.number{position:absolute;left:9px;top:9px;background:rgba(8,12,18,.82);border:1px solid rgba(255,255,255,.17);border-radius:7px;padding:4px 7px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px)}
.tile-meta{padding:10px 11px 12px}
.tile-name{font-size:13px;font-weight:750;line-height:1.35;min-height:18px;word-break:keep-all}
.tile-file{font-size:10px;color:#778499;margin-top:5px}
.empty,.loading{padding:65px 15px;text-align:center;color:var(--muted);background:#121821;border:1px dashed #364153;border-radius:15px}
footer{margin-top:45px;padding-top:18px;border-top:1px solid #28313e;color:#778294;font-size:11px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#lightbox{position:fixed;inset:0;z-index:100;display:none;background:rgba(3,5,9,.96);align-items:center;justify-content:center;padding:70px 75px 58px}
#lightbox.open{display:flex}
.lbimg{max-width:min(94vw,1250px);max-height:calc(100vh - 145px);object-fit:contain;border-radius:9px;box-shadow:0 20px 90px #000}
.lbtop{position:absolute;left:18px;right:18px;top:15px;display:flex;justify-content:space-between;align-items:start;gap:12px}
.lbtext{background:rgba(19,25,35,.88);border:1px solid #354257;border-radius:12px;padding:9px 13px;backdrop-filter:blur(10px)}
.lbtitle{font-weight:800;font-size:14px}
.lbpath{font-size:11px;color:#9daabd;margin-top:4px;word-break:break-all}
.iconbtn,.navbtn{border:1px solid #42516a;background:rgba(20,28,40,.9);color:white;cursor:pointer}
.iconbtn{width:42px;height:42px;border-radius:50%;font-size:23px}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:60px;border-radius:13px;font-size:31px}
.prev{left:16px}.next{right:16px}
.counter{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);font-size:12px;color:#d3deee;background:#172131;border:1px solid #3b4b62;padding:7px 12px;border-radius:999px}
@media(max-width:700px){
 .wrap{padding:22px 12px 56px}
 .stats{gap:7px}.stat{padding:12px 10px}.stat-value{font-size:22px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .tile-meta{padding:8px 9px 10px}.tile-name{font-size:12px}
 .folder-head{padding:13px}.folder-head h2{font-size:18px}
 #lightbox{padding:65px 12px 75px}.lbimg{max-width:98vw;max-height:calc(100vh - 155px)}
 .navbtn{top:auto;bottom:14px;transform:none;width:43px;height:43px;border-radius:50%}
 .prev{left:18px}.next{right:18px}.counter{bottom:23px}
}
</style>
</head>

}
function rawUrl(path){
 return 'https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/'+path.split('/').map(encodeURIComponent).join('/');
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function makeItem(path){
 const name=path.split('/').pop();
 const folder=path.split('/')[2];
 const number=Number((name.match(/^(\d+)/)||[])[1]);
 if(!number||!['기본','누드'].includes(folder))return null;
 const key=pad(number);
 return {path,name,folder,number,key,label:MAP[folder==='기본'?'basic':'nude'][key]||'미매핑',category:''};
}
function setCounts(){
 $('totalCount').innerHTML=allItems.length+'<small>장</small>';
 $('basicCount').innerHTML=allItems.filter(x=>x.folder==='기본').length+'<small>장</small>';
 $('nudeCount').innerHTML=allItems.filter(x=>x.folder==='누드').length+'<small>장</small>';
 $('tabs').querySelector('[data-filter="기본"]').textContent='기본 '+allItems.filter(x=>x.folder==='기본').length;
 $('tabs').querySelector('[data-filter="누드"]').textContent='누드 '+allItems.filter(x=>x.folder==='누드').length;
}
function applyFilters(){
 const q=$('search').value.trim().toLocaleLowerCase();
 visibleItems=allItems.filter(x=>{
  const folderOk=activeFilter==='all'||x.folder===activeFilter;
  const hay=[x.key,x.name,x.label,x.folder,x.category,x.path].join(' ').toLocaleLowerCase();
  return folderOk&&(!q||hay.includes(q));
 });
 render();
}
function render(){
 const root=$('gallery');
 if(!visibleItems.length){
  root.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';
  return;
 }
 const folders=activeFilter==='all'?['기본','누드']:[activeFilter];
 let html='';
 for(const folder of folders){
  const folderItems=visibleItems.filter(x=>x.folder===folder);
  if(!folderItems.length)continue;
  const cats=[...new Set(folderItems.map(x=>x.category))];
  html+='<section class="folder-section">';
  html+='<div class="folder-head"><div class="folder-title"><div class="folder-icon">'+(folder==='기본'?'B':'N')+'</div><div><h2>윤서아 / '+folder+'</h2><div class="folder-desc">'+(folder==='기본'?'기본 · 감정 · 일상 · 운동 · 장면별 이미지':'누드 · 장면별 이미지')+'</div></div></div><div class="folder-count">'+folderItems.length+' / '+allItems.filter(x=>x.folder===folder).length+'장 표시</div></div>';
  for(const cat of cats){
   const items=folderItems.filter(x=>x.category===cat);
   html+='<section class="category"><div class="category-head"><h3>'+escapeHtml(cat)+'</h3><span>'+items.length+'장</span></div><div class="grid">';
   for(const item of items){
    const index=visibleItems.indexOf(item);
    html+='<button class="tile" type="button" data-index="'+index+'" aria-label="'+escapeHtml(item.key+' '+item.label)+'">';
    html+='<div class="thumb"><img loading="lazy" decoding="async" src="'+rawUrl(item.path)+'" alt="'+escapeHtml(item.key+'_'+item.label)+'"><span class="number">'+item.key+'</span></div>';
    html+='<div class="tile-meta"><div class="tile-name">'+escapeHtml(item.label)+'</div><div class="tile-file">'+escapeHtml(item.name)+'</div></div></button>';
   }
   html+='</div></section>';
  }
  html+='</section>';
 }
 root.innerHTML=html;
}
function showLightbox(index){
 if(!visibleItems.length)return;
 currentIndex=(index+visibleItems.length)%visibleItems.length;
 const item=visibleItems[currentIndex];
 $('lbImg').src=rawUrl(item.path);
 $('lbImg').alt=item.key+'_'+item.label;
 $('lbTitle').textContent=item.key+' · '+item.label;
 $('lbPath').textContent=item.path;
 $('counter').textContent=(currentIndex+1)+' / '+visibleItems.length;
 $('lightbox').classList.add('open');
 $('lightbox').setAttribute('aria-hidden','false');
}
function closeLightbox(){
 $('lightbox').classList.remove('open');
 $('lightbox').setAttribute('aria-hidden','true');
 $('lbImg').src='';
 currentIndex=-1;
}
async function loadImages(force){
 $('status').textContent=force?'최신 파일 목록 확인 중…':'GitHub 파일 목록 불러오는 중…';
 try{
  const url='https://api.github.com/repos/'+OWNER+'/'+REPO+'/git/trees/'+BRANCH+'?recursive=1&ts='+Date.now();
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error('GitHub API '+response.status);
  const data=await response.json();
  const paths=(data.tree||[]).filter(x=>x.type==='blob'&&x.path.startsWith(ROOT)&&/\.(png|jpe?g|webp|gif)$/i.test(x.path)).map(x=>x.path);
  const next=paths.map(makeItem).filter(Boolean).sort((a,b)=>{
   const f=['기본','누드'].indexOf(a.folder)-['기본','누드'].indexOf(b.folder);
   return f||a.number-b.number;
  });
  const changed=data.sha!==lastTreeSha||next.length!==allItems.length;
  allItems=next;
  lastTreeSha=data.sha||'';
  allItems.forEach(x=>x.category=category(x));
  setCounts();
  applyFilters();
  $('status').textContent='총 '+allItems.length+'장 · GitHub 최신 목록 확인 '+new Date().toLocaleTimeString('ko-KR');
  $('updated').textContent='자동 갱신 중 · 마지막 확인 '+new Date().toLocaleTimeString('ko-KR');
 }catch(error){
  $('status').textContent='목록을 불러오지 못했습니다: '+error.message+' · 새로고침을 눌러 다시 시도하세요.';
  if(!allItems.length)$('gallery').innerHTML='<div class="empty">GitHub 이미지 목록을 불러오지 못했습니다.<br>잠시 후 새로고침을 눌러주세요.</div>';
 }
}
$('search').addEventListener('input',applyFilters);
$('tabs').addEventListener('click',event=>{
 const tab=event.target.closest('[data-filter]');
 if(!tab)return;
 activeFilter=tab.dataset.filter;
 $('tabs').querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));
 applyFilters();
});
$('refresh').addEventListener('click',()=>loadImages(true));
$('gallery').addEventListener('click',event=>{
 const tile=event.target.closest('[data-index]');
 if(tile)showLightbox(Number(tile.dataset.index));
});
$('close').addEventListener('click',closeLightbox);
$('prev').addEventListener('click',()=>showLightbox(currentIndex-1));
$('next').addEventListener('click',()=>showLightbox(currentIndex+1));
$('lightbox').addEventListener('click',event=>{if(event.target===$('lightbox'))closeLightbox();});
document.addEventListener('keydown',event=>{
 if(!$('lightbox').classList.contains('open'))return;
 if(event.key==='Escape')closeLightbox();
 if(event.key==='ArrowLeft')showLightbox(currentIndex-1);
 if(event.key==='ArrowRight')showLightbox(currentIndex+1);
});
loadImages(false);
setInterval(()=>{if(document.visibilityState==='visible')loadImages(false);},120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadImages(false);});
</script>
</body>
</html>
