<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>LARGO · a17 이미지 갤러리</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#f5eef4;background:#111017}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:3;background:#17141eef;backdrop-filter:blur(12px);border-bottom:1px solid #3b3344;padding:16px max(16px,calc((100vw - 1500px)/2))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:24px;letter-spacing:.1em;margin:0}.sub{color:#aaa2b0;font-size:12px;margin:6px 0}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}input,select,button{background:#25202d;color:white;border:1px solid #574c62;border-radius:10px;padding:10px 12px}input{flex:1;min-width:180px}button[aria-pressed="true"],.active{background:#80496e;border-color:#d39abd}button:hover{border-color:#e1aad3}main{max-width:1500px;margin:auto;padding:18px 16px 70px}.stats{margin:12px 0 20px;color:#c9bbcc}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.section{margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #423747;padding-bottom:10px}.section h2{font-size:19px;margin:0}.section small{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.tile{background:#1d1923;border:1px solid #38303e;border-radius:12px;padding:0;overflow:hidden;text-align:left;min-width:0}.tile img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#302735}.meta{padding:10px}.num{font-size:12px;color:#b8a0bb}.name{font-size:14px;font-weight:650;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.error{color:#ffb4b4}.empty{padding:40px 0;color:#aaa}#viewer{position:fixed;inset:0;z-index:10;background:#07060af5;display:none;align-items:center;justify-content:center;flex-direction:column}#viewer.show{display:flex}#viewer img{max-width:calc(100vw - 90px);max-height:calc(100vh - 130px);object-fit:contain}#viewer .info{padding:10px;text-align:center;font-size:14px}#viewer button{position:absolute}#close{top:16px;right:16px}#prev{left:8px;top:48%}#next{right:8px;top:48%}.hint{font-size:12px;color:#bcb2c2}body.lock{overflow:hidden}@media(max-width:600px){header{padding:13px}h1{font-size:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile img{aspect-ratio:3/4}#viewer img{max-width:calc(100vw - 64px)}#prev{left:2px}#next{right:2px}}@media(min-width:1100px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style></head><body>
<header><div class="top"><div><h1>LARGO <span style="color:#ba85ab">/ A17</span></h1><p class="sub">캐릭터별 이미지 · 번호 및 장면명 매핑</p></div><button id="reload" type="button">↻ 목록 새로고침</button></div>
<div class="tools"><input id="search" type="search" placeholder="번호 · 파일명 · 장면명 검색 (예: 001, 무표정응시)" aria-label="이미지 검색"><select id="sort" aria-label="정렬"><option value="asc">번호 오름차순</option><option value="desc">번호 내림차순</option></select></div></header>
<main><div class="stats" id="stats">GitHub에서 이미지 목록을 불러오는 중…</div><nav class="tabs" id="tabs" aria-label="캐릭터 선택"></nav><div id="gallery"></div><p class="hint">이미지 클릭: 확대 · 좌우 화살표: 이전/다음 · ESC: 닫기 · 새 파일 자동 확인: 5분 간격</p></main>
<div id="viewer" role="dialog" aria-modal="true" aria-label="이미지 확대 보기"><button id="close" aria-label="닫기">✕</button><button id="prev" aria-label="이전 이미지">❮</button><img id="large" alt=""><button id="next" aria-label="다음 이미지">❯</button><div class="info" id="info"></div></div>
<script>
(()=>{'use strict';
const owner='Ringno',repo='A',folder='a17',branch='main';
const mapping=["무표정응시","옅은미소","내려다봄","고개갸웃","눈웃음","질투","삐침","입술깨물기","놀람","홍조","울면서웃음","반쯤감은눈","한숨","등돌림","팬티","꼭지당기기","엉덩이내밀기","도게자","자위,보지벌리기","정상위","정상위절정","카우걸","카우걸절정","후배위","후배위절정","파일드라이버","들박","들박절정","배면들박","배면들박절정","입위","입위절정","측위","측위절정","좌위","좌위절정","펠라","펠라사정","딥스로트","딥스로트사정","페이스시팅","핸드잡","핸드잡사정","파이즈리","파이즈리사정","풋잡","풋잡사정","엉덩이만지기","림잡","스팽킹","스팽킹","가슴만지기","가슴빨기","핑거링","키스","겨드랑이핥기","아마존","커닐링구스","정액입에머금음","자지핥기","69자세","수유대딸","배빵","관계중전화","밧줄걷기","로터","로터","딜도","딜도","애널플러그","애널플러그","시바리","시바리","호그타이","호그타이","공중매달기","공중매달기","볼개그","볼개그","목줄","목줄","유두클램프","유두클램프","애원","정액범벅","젖분비","젖분비","분수","개목줄","개목줄","검은안대","검은안대","안대자위","안대자위","목줄당김","목줄당김","스프레더바","스프레더바","비트개그","비트개그","여자머리채","여자싸대기","머리채잡고후배위","유두에페니스"];
const allowed=/\.(png|jpe?g|webp|gif|avif)$/i;
const $=id=>document.getElementById(id);
const encoded=p=>p.split('/').map(encodeURIComponent).join('/');
let items=[],active='전체',visible=[],current=-1,lastFetch=0,loading=false;
const title=file=>{const match=file.match(/^(\d{1,3})(?:_|\.|$)/);if(!match)return file.replace(/\.[^.]+$/,'');const n=Number(match[1]);const base=file.replace(/\.[^.]+$/,'');return (n>=1&&n<=mapping.length)?mapping[n-1]:(base.includes('_')?base.slice(base.indexOf('_')+1):base)};
const number=file=>{const m=file.match(/^(\d+)/);return m?Number(m[1]):Infinity};
function backupList(){const names=['배수아','정하람','문세린','강도희','임사비'];const out=[];for(const group of names){for(let n=0;n<=103;n++){const file=String(n).padStart(3,'0')+'.png';const path=folder+'/'+group+'/'+file;out.push({path,file,group,url:'https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+branch+'/'+encoded(path),label:title(file),n,backup:true})}}return out}
function groups(){const m=new Map();for(const f of items)m.set(f.group,(m.get(f.group)||0)+1);return [...m].sort((a,b)=>a[0].localeCompare(b[0],'ko'))}
function renderTabs(){const tabs=$('tabs');tabs.replaceChildren();const all=[['전체',items.length],...groups()];if(active!=='전체'&&!all.some(([g])=>g===active))active='전체';for(const [g,c] of all){const b=document.createElement('button');b.textContent=g+' · '+c;b.setAttribute('aria-pressed',String(active===g));b.addEventListener('click',()=>{active=g;render()});tabs.append(b)}}
function render(){renderTabs();const q=$('search').value.trim().toLowerCase();const desc=$('sort').value==='desc';visible=items.filter(f=>(active==='전체'||f.group===active)&&(!q||[f.file,f.path,f.group,f.label,String(f.n).padStart(3,'0')].some(s=>String(s).toLowerCase().includes(q)))).sort((a,b)=>a.group.localeCompare(b.group,'ko')||(desc?b.n-a.n:a.n-b.n)||a.file.localeCompare(b.file,'ko'));
$('stats').textContent='전체 '+items.length.toLocaleString()+'장 · '+groups().length+'개 폴더 · 현재 '+visible.length.toLocaleString()+'장';
const root=$('gallery');root.replaceChildren();if(!visible.length){const e=document.createElement('p');e.className='empty';e.textContent='검색 결과가 없습니다.';root.append(e);return}
const grouped=new Map();for(let i=0;i<visible.length;i++){const f=visible[i];if(!grouped.has(f.group))grouped.set(f.group,[]);grouped.get(f.group).push([f,i])}
for(const [g,files] of grouped){const sect=document.createElement('section');const head=document.createElement('div');head.className='section';const h=document.createElement('h2');h.textContent=g;const cnt=document.createElement('small');cnt.textContent=files.length+'장';head.append(h,cnt);sect.append(head);const grid=document.createElement('div');grid.className='grid';
for(const [f,i] of files){const tile=document.createElement('button');tile.className='tile';tile.title=f.path+' · '+f.label;const img=document.createElement('img');img.src=f.url;img.loading='lazy';img.decoding='async';img.alt=f.group+' '+f.label;const meta=document.createElement('div');meta.className='meta';const num=document.createElement('div');num.className='num';num.textContent=f.file;const name=document.createElement('div');name.className='name';name.textContent=f.label;meta.append(num,name);img.addEventListener('error',()=>{if(f.backup){tile.remove();}});tile.append(img,meta);tile.addEventListener('click',()=>show(i));grid.append(tile)}
sect.append(grid);root.append(sect)}}
function show(i){if(!visible.length)return;current=(i+visible.length)%visible.length;const f=visible[current];$('large').src=f.url;$('large').alt=f.group+' '+f.label;$('info').textContent=f.group+' · '+f.file+' · '+f.label+' ('+(current+1)+'/'+visible.length+')';$('viewer').classList.add('show');document.body.classList.add('lock')}
function close(){$('viewer').classList.remove('show');document.body.classList.remove('lock');$('large').removeAttribute('src')}
async function load(silent=false){if(loading)return;loading=true;$('reload').disabled=true;items=backupList();lastFetch=Date.now();render();$('stats').textContent='전체 최대 '+items.length+'장 · 5개 캐릭터 폴더 · 이미지 직접 로딩 (없는 파일 자동 제외)';$('stats').classList.remove('error');loading=false;$('reload').disabled=false}

$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('reload').addEventListener('click',()=>load());$('close').addEventListener('click',close);$('prev').addEventListener('click',()=>show(current-1));$('next').addEventListener('click',()=>show(current+1));$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))close()});document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('show'))return;if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(current-1);else if(e.key==='ArrowRight')show(current+1)});let touchX=null;$('viewer').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});$('viewer').addEventListener('touchend',e=>{if(touchX===null)return;const delta=e.changedTouches[0].screenX-touchX;if(Math.abs(delta)>60)show(current+(delta<0?1:-1));touchX=null},{passive:true});
setInterval(()=>{if(Date.now()-lastFetch>=300000)load(true)},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastFetch>=300000)load(true)});load();
})();
</script></body></html>
